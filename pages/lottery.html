<div class="hero-bg"></div>

<div class="container">

    <h1>六一抽奖</h1>
    <button id="backBtn">← 返回首页</button>
    <div class="ink-line"></div>

    <div class="lottery-panel">

        <button id="joinLotteryBtn">
            报名抽奖
        </button>

        <div class="wheel-wrapper">

            <div class="pointer"></div>

            <canvas
                id="wheel"
                width="800"
                height="800">
            </canvas>

        </div>
        <h2 id="winnerText"></h2>

        <button id="spinBtn">
            正式抽奖
        </button>

        <button id="testSpinBtn">
            测试抽奖
        </button>

        <br>
        
        <!-- 👇 历史中奖列表 --> 
        <h3>正式中奖记录</h3>
        <div id="winnerList" class="winner-list"></div>

        <h3>测试中奖记录</h3>
        <div id="testWinnerList" class="winner-list"></div>


    </div>

</div>
